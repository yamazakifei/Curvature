experiment:
  id: nn_2layers_stage0_smoke
  master_seed: 20260727
  slots: 40
  warmup_slots: 5
  topology_seeds:
  - 0
  channel_seeds:
  - 0
  update_seeds:
  - 0
topology:
  type: random_geometric
  params:
    n_nodes: 16
    area_width_m: 120.0
    area_height_m: 120.0
    communication_radius_m: 65.0
    min_degree: 2
    max_attempts: 1000
source:
  update_probability: 0.05
channel:
  tx_power_dbm: 20.0
  pathloss_reference_db: 30.0
  pathloss_exponent: 2.5
  shadowing_std_db: 2.0
  rayleigh_fading: true
  sinr_threshold_db: 3.0
curvature:
  method: distributed_af3
  normalization: local_degree_bound
constraints:
  target_tx_ratio: 0.1
  per_node_cap_multiplier: 1.5
policies:
- name: uniform_random
  type: random
  params:
    tx_probability: 0.1
- name: curvature_fixed_alpha
  type: curvature_fixed_alpha
  params:
    target_tx_ratio: 0.1
    alpha: 1.0
    curvature_center: 0.0
    alpha_override: null
- name: alpha_override_zero
  type: curvature_fixed_alpha
  params:
    target_tx_ratio: 0.1
    alpha: 1.0
    curvature_center: 0.0
    alpha_override: 0.0
- name: matched_rate_random
  type: matched_rate_random
  params:
    reference_policy: curvature_fixed_alpha
output:
  root: result_NN/stage0
  save_per_slot: false
  make_plots: false
