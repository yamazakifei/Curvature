experiment:
  id: nn_2layers_stage1_smoke
  master_seed: 20260727
  slots: 30
topology:
  type: random_geometric
  params:
    n_nodes: 16
    area_width_m: 120.0
    area_height_m: 120.0
    communication_radius_m: 65.0
    min_degree: 2
    max_attempts: 1000
source:
  update_probability: 0.05
channel:
  tx_power_dbm: 20.0
  pathloss_reference_db: 30.0
  pathloss_exponent: 2.5
  shadowing_std_db: 2.0
  rayleigh_fading: true
  sinr_threshold_db: 3.0
curvature:
  method: distributed_af3
  normalization: local_degree_bound
constraints:
  target_tx_ratio: 0.1
  per_node_cap_multiplier: 1.5
actor:
  stage: 1
  curvature:
    score: incident_bottleneck_max
    center: 0.1703811813186813
    alpha_parameterization: softplus
    alpha_init: 0.1
    alpha_override: null
  residual:
    enabled: false
  architecture_version: curvature_stage1_v1
  input_feature_names:
  - incident_bottleneck_max
observation:
  consecutive_tx_scale: 3.0
  neighbor_confidence_time_constant: 20.0
  congestion_ewma_beta: 0.8
  congestion_feature_scale: 5.0
training:
  episodes: 2
  rollout_slots: 30
  topology_seed_start: 43000
  center_topology_seeds:
  - 43000
  target_tx_ratios:
  - 0.1
  node_counts:
  - 16
  update_probabilities:
  - 0.05
  learning_rate: 0.0003
  clip_ratio: 0.2
  entropy_coefficient: 0.0
  gamma: 0.99
  gae_lambda: 0.95
  ppo_epochs: 2
  vaoi_reward_scale: 0.1
  use_budget_advantage: false
  update_multiplier: false
  initial_multiplier: 0.0
  multiplier_learning_rate: 0.01
  multiplier_max: 0.15
  tx_ratio_ema_beta: 0.9
  budget_relative_tolerance: 0.05
  multiplier_error_clip: 1.0
  checkpoint_every_episodes: 1
output:
  root: result_NN
  save_per_slot: false
  make_plots: false
