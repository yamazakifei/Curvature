experiment:
  id: mpnn_heuristic_channel_n100_u0.20_b0.10_a1.5_newlr
  description: 调整a/c各自的学习率
  master_seed: 20260723
  slots: 500
topology:
  type: soft_two_community
  params:
    n_nodes: 100
    cluster_sizes:
    - 50
    - 50
    area_width_m: 400.0
    area_height_m: 300.0
    communication_radius_m: 40.0
    center_separation_m: 160.0
    cluster_radius_m: 80.0
    cross_edge_count_range:
    - 2
    - 4
    min_cross_endpoints_per_cluster: 2
    min_degree: 3
    require_induced_cluster_connected: true
    min_edge_connectivity: 2
    max_attempts: 2000
source:
  update_probability: 0.2
channel:
  tx_power_dbm: 20.0
  pathloss_reference_db: 30.0
  reference_distance_m: 1.0
  pathloss_exponent: 2.5
  shadowing_std_db: 0.0
  reciprocal_shadowing: true
  rayleigh_fading: false
  noise_psd_dbm_per_hz: -174.0
  bandwidth_hz: 1000000.0
  noise_figure_db: 5.0
  sinr_threshold_db: -3.0
curvature:
  method: distributed_af3
  normalization: local_degree_bound
constraints:
  target_tx_ratio: 0.1
  per_node_cap_multiplier: 1.5
actor:
  stage: 2
  curvature:
    score: incident_bottleneck_max
    center: 0.4012991820118967
    alpha_parameterization: softplus
    alpha_init: 1.5
    alpha_override: 1.5
  residual:
    enabled: true
    architecture: mpnn
    hidden_dims:
    - 64
    - 64
    activation: relu
    delta_max: 1.0
    zero_init_output: true
    use_stage1_reference: true
    detach_stage1_reference: true
    include_scenario_context: false
    include_curvature_mean: false
    include_curvature_freshness_interaction: false
    freeze_stage1: true
    mpnn:
      message_hidden_dims:
      - 32
      message_dim: 16
      update_hidden_dims:
      - 64
      - 64
      aggregation: mean_max
      condition_message_on_receiver: true
      use_sender_node_features: false
      use_curvature_edge_feature: false
  architecture_version: curvature_stage2_mpnn_v1
  residual_architecture: mpnn
  node_input_feature_names: &id001
  - normalized_degree
  - time_since_last_tx
  - consecutive_tx_attempts
  - congestion_ewma
  - self_information_increment
  edge_input_feature_names:
  - neighbor_estimate_valid
  - neighbor_freshness_gain
  - neighbor_estimate_confidence
  node_input_dim: 5
  edge_input_dim: 3
  message_input_dim: 8
  message_dim: 16
  aggregation: mean_max
  aggregated_message_dim: 32
  decoder_input_dim: 38
  condition_message_on_receiver: true
  use_sender_node_features: false
  use_curvature_edge_feature: false
  input_feature_names: *id001
observation:
  consecutive_tx_scale: 3.0
  neighbor_confidence_time_constant: 20.0
  congestion_ewma_beta: 0.8
  congestion_feature_scale: 5.0
training:
  episodes: 300
  rollout_slots: 400
  topology_seed_start: 40000
  target_tx_ratios:
  - 0.1
  node_counts:
  - 100
  update_probabilities:
  - 0.2
  actor_learning_rate: 0.0005
  critic_learning_rate: 0.001
  clip_ratio: 0.2
  entropy_coefficient: 0.0
  gamma: 0.99
  gae_lambda: 0.95
  ppo_epochs: 4
