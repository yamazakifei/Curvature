experiment:
  id: mpnnV3.5_CurvAttn_ch1_n100_u0.20_versionGap_rawBmax
  description: 'V3.5 single-N: curvature-prior attention weighted mean plus element-wise
    max, with normalized version-gap freshness and raw_bmax edge encoding.'
  master_seed: 20260723
  slots: 500
randomness:
  mode: derived_namespaces
  save_manifest: true
  derivation_version: v1
topology:
  type: soft_two_community
  params:
    n_nodes: 100
    cluster_sizes:
    - 50
    - 50
    area_width_m: 400.0
    area_height_m: 300.0
    communication_radius_m: 40.0
    center_separation_m: 160.0
    cluster_radius_m: 80.0
    cross_edge_count_range:
    - 2
    - 4
    min_cross_endpoints_per_cluster: 2
    min_degree: 3
    require_induced_cluster_connected: true
    min_edge_connectivity: 2
    max_attempts: 2000
source:
  update_probability: 0.2
channel:
  tx_power_dbm: 20.0
  pathloss_reference_db: 30.0
  reference_distance_m: 1.0
  pathloss_exponent: 2.5
  shadowing_std_db: 0.0
  reciprocal_shadowing: true
  rayleigh_fading: false
  noise_psd_dbm_per_hz: -174.0
  bandwidth_hz: 1000000.0
  noise_figure_db: 5.0
  sinr_threshold_db: -3.0
curvature:
  method: distributed_af3
  normalization: local_degree_bound
constraints:
  max_tx_ratio: 0.1
  per_node_cap_multiplier: 1.5
actor:
  stage: 2
  curvature:
    enabled: true
    score: incident_bottleneck_max
    center_mode: none
    center: 0.0
    alpha_parameterization: softplus
    alpha_init: 1.5
    alpha_override: 1.0
    base_tx_ratio: 0.096875
    calibrated_intercept: -2.6624755859375
    base_search:
      schema_version: v3_2
      enabled: false
      calibration:
        topology_count: 32
        intercept_tolerance: 1.0e-06
        intercept_max_iterations: 100
      base_candidates:
        mode: coarse_to_fine
        min_fraction_of_max: 0.25
        max_fraction_of_max: 1.0
        coarse_count: 7
        refine: true
        refine_count: 5
        refine_per_alpha: true
      alpha_candidates:
      - 0.5
      - 1.0
      - 1.2
      - 1.5
      - 1.8
      evaluation:
        topology_count: 20
        dynamic_repeats: 2
        coarse_topology_count: 10
        coarse_dynamic_repeats: 1
        coarse_slots: 200
        full_slots: 500
        slots: 500
        metric: mean_VAoI
        max_probability_tolerance: 0.005
        tie_relative_tolerance: 0.01
        prefer_lower_probability_on_tie: true
        candidate_selection:
          coarse_keep_top_k_per_alpha: 2
        cache:
          enabled: true
          cache_topology: true
          cache_curvature: true
          cache_propagation: true
        parallel:
          enabled: true
          backend: process
          workers: 4
          chunksize: 1
          deterministic_order: true
        runtime_profile:
          enabled: true
          output_file: stage1_search_runtime.json
      save_per_scenario: true
  residual:
    enabled: true
    architecture: mpnn
    hidden_dims:
    - 64
    - 64
    activation: relu
    delta_max: 1.0
    zero_init_output: true
    use_stage1_reference: true
    detach_stage1_reference: true
    include_scenario_context: false
    include_curvature_mean: false
    include_curvature_freshness_interaction: false
    freeze_stage1: true
    mpnn:
      message_hidden_dims:
      - 32
      message_dim: 16
      update_hidden_dims:
      - 64
      - 64
      condition_message_on_receiver: true
      use_sender_node_features: false
      aggregation: curvature_attention_max
      use_curvature_edge_feature: true
      attention_temperature: 0.5
      attention_uniform_mix: 0.0
      bmax: 20.0
      edge_normalization: raw_bmax
      edge_freshness_feature: normalized_version_gap
      version_gap_tau: null
  architecture_version: curvature_stage2_mpnn_v3_5
  residual_architecture: mpnn
  node_input_feature_names: &id001
  - normalized_degree
  - time_since_last_tx
  - consecutive_tx_attempts
  - congestion_ewma
  - self_information_increment
  edge_input_feature_names:
  - neighbor_version_gap_normalized
  - neighbor_estimate_confidence
  - clipped_bottleneck_score
  node_input_dim: 5
  edge_input_dim: 3
  message_input_dim: 8
  message_dim: 16
  aggregation: curvature_attention_max
  aggregated_message_dim: 32
  decoder_input_dim: 38
  condition_message_on_receiver: true
  use_sender_node_features: false
  use_curvature_edge_feature: true
  bmax: 20.0
  attention_temperature: 0.5
  attention_uniform_mix: 0.0
  edge_normalization: raw_bmax
  edge_freshness_feature: normalized_version_gap
  version_gap_tau: null
  input_feature_names: *id001
  curvature_enabled: true
critic:
  architecture: node_conditioned
  hidden_dims:
  - 64
  - 64
  activation: relu
  include_scenario_context: true
  include_exact_node_features: true
  include_channel_features: true
  include_curvature_features: true
  advantage_mode: node_gae
  bootstrap_rollout_end: true
observation:
  consecutive_tx_scale: 3.0
  neighbor_confidence_time_constant: 20.0
  congestion_ewma_beta: 0.8
  congestion_feature_scale: 5.0
training:
  episodes: 500
  rollout_slots: 400
  max_tx_ratios:
  - 0.1
  node_counts:
  - 100
  update_probabilities:
  - 0.2
  actor_learning_rate: 0.0001
  critic_learning_rate: 0.0003
  common_mode_coefficient: 0.05
  probability_budget_coefficient: 0.8
  clip_ratio: 0.2
  entropy_coefficient: 0.0
  diagnostics:
    enabled: false
    every_episodes: 20
    include_mpnn_messages: false
    include_mpnn_attention: false
  gamma: 0.99
  gae_lambda: 0.95
  ppo_epochs: 4
  vaoi_reward_scale: 0.1
  use_budget_advantage: true
  update_multiplier: true
  initial_multiplier: 0.0
  multiplier_learning_rate: 0.01
  multiplier_max: 0.15
  tx_ratio_ema_beta: 0.5
  budget_relative_tolerance: 0.0
  multiplier_error_clip: 1.0
  initial_checkpoint: null
  restore_actor_only: true
validation:
  enabled: true
  trigger: every_episodes
  every_episodes: 10
  checkpoint_mode: validation_best_only
  evaluate_baselines: false
  scenario_generation:
    mode: auto
    scenario_count: 20
    slots: 500
    n_nodes: 100
    update_probability: 0.2
    max_tx_ratio: 0.1
output:
  root: result_GNN
  save_per_slot: false
  make_plots: false
