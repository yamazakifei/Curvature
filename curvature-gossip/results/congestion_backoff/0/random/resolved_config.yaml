experiment:
  id: congestion_backoff
  master_seed: 20260715
  slots: 5000
  warmup_slots: 100
  trace_stride: 1
  topology_seeds:
  - 0
  channel_seeds:
  - 0
  update_seeds:
  - 0
topology:
  type: soft_two_community
  params:
    n_nodes: 50
    cluster_sizes:
    - 25
    - 25
    area_width_m: 260.0
    area_height_m: 160.0
    communication_radius_m: 40.0
    cluster_radius_m: 70.0
    center_separation_m: 120.0
    min_degree: 3
    require_induced_cluster_connected: true
    min_edge_connectivity: 2
    max_attempts: 2000
source:
  update_probability: 0.05
channel:
  tx_power_dbm: 20.0
  pathloss_reference_db: 30.0
  reference_distance_m: 1.0
  pathloss_exponent: 2.5
  shadowing_std_db: 0.0
  reciprocal_shadowing: true
  rayleigh_fading: false
  noise_psd_dbm_per_hz: -174.0
  bandwidth_hz: 1000000.0
  noise_figure_db: 5.0
  sinr_threshold_db: -3.0
curvature:
  method: global_orc
  alpha: 0.5
  normalization: global_negative_max
policies:
- name: random
  type: random
  params:
    tx_probability: 0.1
- name: freshness_no_backoff
  type: freshness
  params:
    source_aggregation: max
    q_min: 0.005
    q_max: 0.4
    threshold: 2.0
    temperature: 1.0
    age_weight: 0.005
    congestion_backoff_weight: 0.0
    congestion_ewma_alpha: 0.8
    attempt_backoff_factor: 1.0
- name: freshness_backoff
  type: freshness
  params:
    source_aggregation: max
    q_min: 0.005
    q_max: 0.4
    threshold: 2.0
    temperature: 1.0
    age_weight: 0.005
    congestion_backoff_weight: 0.2
    congestion_ewma_alpha: 0.8
    attempt_backoff_factor: 0.65
- name: orc_freshness_no_backoff
  type: curvature_freshness
  params:
    source_aggregation: max
    q_min: 0.005
    q_max: 0.4
    threshold: 2.0
    temperature: 1.0
    age_weight: 0.005
    congestion_backoff_weight: 0.0
    congestion_ewma_alpha: 0.8
    attempt_backoff_factor: 1.0
    curvature_weight: 1.0
- name: orc_freshness_backoff
  type: curvature_freshness
  params:
    source_aggregation: max
    q_min: 0.005
    q_max: 0.4
    threshold: 2.0
    temperature: 1.0
    age_weight: 0.005
    congestion_backoff_weight: 0.2
    congestion_ewma_alpha: 0.8
    attempt_backoff_factor: 0.65
    curvature_weight: 1.0
output:
  root: results
  save_per_slot: true
  make_plots: true
  smoothing_window: 10
