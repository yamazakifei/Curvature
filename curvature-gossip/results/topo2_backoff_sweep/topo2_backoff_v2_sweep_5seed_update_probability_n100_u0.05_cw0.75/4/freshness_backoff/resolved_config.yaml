experiment:
  id: topo2_backoff_v2_sweep_5seed_update_probability_n100_u0.05_cw0.75
  master_seed: 20260715
  slots: 1000
  warmup_slots: 50
  trace_stride: 1
  topology_seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  channel_seeds:
  - 0
  update_seeds:
  - 0
topology:
  type: soft_two_community
  params:
    n_nodes: 100
    cluster_sizes:
    - 50
    - 50
    area_width_m: 400.0
    area_height_m: 300.0
    communication_radius_m: 40.0
    center_separation_m: 160.0
    cluster_radius_m: 80.0
    cross_edge_count_range:
    - 2
    - 4
    min_cross_endpoints_per_cluster: 2
    min_degree: 3
    require_induced_cluster_connected: true
    min_edge_connectivity: 2
    max_attempts: 2000
source:
  update_probability: 0.05
channel:
  tx_power_dbm: 20.0
  pathloss_reference_db: 30.0
  reference_distance_m: 1.0
  pathloss_exponent: 2.5
  shadowing_std_db: 0.0
  reciprocal_shadowing: true
  rayleigh_fading: false
  noise_psd_dbm_per_hz: -174.0
  bandwidth_hz: 1000000.0
  noise_figure_db: 5.0
  sinr_threshold_db: -3.0
curvature:
  method: global_orc
  alpha: 0.5
  normalization: global_negative_max
policies:
- name: random
  type: random
  params:
    tx_probability: 0.18
- name: freshness_backoff
  type: freshness
  params:
    source_aggregation: max
    q_min: 0.01
    q_max: 0.45
    gain_compression: log1p
    gain_normalization: log_node_count
    threshold: 0.6
    temperature: 0.2
    age_weight: 0.003
    congestion_backoff_weight: 0.08
    congestion_ewma_alpha: 0.8
    attempt_backoff_factor: 1
- name: orc_freshness_backoff
  type: curvature_freshness
  params:
    source_aggregation: max
    q_min: 0.01
    q_max: 0.45
    gain_compression: log1p
    gain_normalization: log_node_count
    threshold: 0.6
    temperature: 0.2
    age_weight: 0.003
    congestion_backoff_weight: 0.08
    congestion_ewma_alpha: 0.8
    attempt_backoff_factor: 1
    curvature_weight: 0.75
output:
  root: D:\ZMF\2026Curvature\curvature-gossip\results
  save_per_slot: false
  node_diagnostics_stride: 0
  make_plots: false
  smoothing_window: 10
