[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curvature-gossip"
version = "1.0.0"
description = "Curvature-aware distributed gossip simulator"
requires-python = ">=3.7"
dependencies = [
  "numpy",
  "scipy",
  "networkx",
  "PyYAML",
  "matplotlib",
  "pandas",
  "seaborn",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
curvature-gossip = "curvature_gossip.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
