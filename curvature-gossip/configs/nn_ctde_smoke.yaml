# 快速验证局部 AF3、双层约束和 TensorFlow 训练链路；结果只写入 result_NN。
experiment:
  id: nn_ctde_node_v2_smoke
  master_seed: 20260716
  slots: 40
topology:
  type: random_geometric
  params:
    n_nodes: 16
    area_width_m: 120.0
    area_height_m: 120.0
    communication_radius_m: 65.0
    min_degree: 2
    max_attempts: 1000
source:
  update_probability: 0.05
channel:
  tx_power_dbm: 20.0
  pathloss_reference_db: 30.0
  pathloss_exponent: 2.5
  shadowing_std_db: 2.0
  rayleigh_fading: true
  sinr_threshold_db: 3.0
curvature:
  method: distributed_af3
  normalization: local_degree_bound
constraints:
  target_tx_ratio: 0.10
  per_node_cap_multiplier: 1.5
training:
  episodes: 2
  rollout_slots: 40
  topology_seed_start: 30000
  learning_rate: 0.0003
  initial_lagrange: 1.0
  lagrange_learning_rate: 0.5
  local_debt_penalty: 0.2
  vaoi_reward_scale: 0.1
  budget_advantage_weight: 0.15
  debt_advantage_weight: 0.05
  constraint_advantage_scale: 1.0
  ppo_epochs: 2
output:
  root: result_NN
  save_per_slot: false
  make_plots: false
