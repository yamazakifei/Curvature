# 验证训练 checkpoint 可由标准仿真 runner 以纯本地节点策略加载。
experiment:
  id: nn_ctde_eval_smoke
  master_seed: 20260717
  slots: 50
  warmup_slots: 5
  topology_seeds: [0]
  channel_seeds: [0]
  update_seeds: [0]
topology:
  type: random_geometric
  params:
    n_nodes: 16
    area_width_m: 120.0
    area_height_m: 120.0
    communication_radius_m: 65.0
    min_degree: 2
    max_attempts: 1000
source:
  update_probability: 0.05
channel:
  tx_power_dbm: 20.0
  pathloss_reference_db: 30.0
  pathloss_exponent: 2.5
  shadowing_std_db: 2.0
  rayleigh_fading: true
  sinr_threshold_db: 3.0
curvature:
  method: distributed_af3
  normalization: local_degree_bound
constraints:
  target_tx_ratio: 0.10
  per_node_cap_multiplier: 1.5
policies:
  - name: nn_af3_smoke
    type: neural_ctde
    params:
      checkpoint_path: result_NN/nn_ctde_smoke/checkpoints/model
      target_tx_ratio: 0.10
      q_min: 0.001
      q_max: 0.4
output:
  root: result_NN/evaluation
  save_per_slot: true
  node_diagnostics_stride: 0
  make_plots: false
