# 功能：在精调启发式使用的物理信道下训练 Stage-2 NN，同时保留 distributed AF3、
# 相同随机种子与训练超参数，用于隔离信道配置对 VAoI 的影响。
experiment:
  id: nn_2layers_stage2_heuristic_channel_n100_u0.20_b0.15_a1.50_v2
  master_seed: 20260723
  slots: 500
topology:
  type: soft_two_community
  params:
    n_nodes: 100
    cluster_sizes: [50, 50]
    area_width_m: 400.0
    area_height_m: 300.0
    communication_radius_m: 40.0
    center_separation_m: 160.0
    cluster_radius_m: 80.0
    cross_edge_count_range: [2, 4]
    min_cross_endpoints_per_cluster: 2
    min_degree: 3
    require_induced_cluster_connected: true
    min_edge_connectivity: 2
    max_attempts: 2000
source:
  update_probability: 0.20
channel:
  # 与 test_vaoi_vs_transmissions_u0.2 的精调启发式物理信道保持一致。
  tx_power_dbm: 20.0
  pathloss_reference_db: 30.0
  reference_distance_m: 1.0
  pathloss_exponent: 2.5
  shadowing_std_db: 0.0
  reciprocal_shadowing: true
  rayleigh_fading: false
  noise_psd_dbm_per_hz: -174.0
  bandwidth_hz: 1000000.0
  noise_figure_db: 5.0
  sinr_threshold_db: -3.0
curvature:
  # 保留 NN 的局部可实现曲率，避免同时改变信道和 Actor 曲率输入。
  method: distributed_af3
  normalization: local_degree_bound
constraints:
  target_tx_ratio: 0.15
  per_node_cap_multiplier: 1.5
actor:
  stage: 2
  curvature:
    score: incident_bottleneck_max
    center: auto
    alpha_parameterization: softplus
    alpha_init: 1.5
    alpha_override: 1.5
  residual:
    enabled: true
    hidden_dims: [64, 64]
    activation: relu
    delta_max: 1.0
    zero_init_output: true
    use_stage1_reference: true
    detach_stage1_reference: true
    include_scenario_context: false
    include_curvature_mean: false
    include_curvature_freshness_interaction: false
    freeze_stage1: true
observation:
  consecutive_tx_scale: 3.0
  neighbor_confidence_time_constant: 20.0
  congestion_ewma_beta: 0.8
  congestion_feature_scale: 5.0
training:
  # 首轮保持 200 episodes，确保与当前结果构成单变量对照。
  episodes: 300
  rollout_slots: 400
  topology_seed_start: 40000
  target_tx_ratios: [0.15]
  node_counts: [100]
  update_probabilities: [0.20]
  learning_rate: 0.0003
  clip_ratio: 0.2
  entropy_coefficient: 0.0
  gamma: 0.99
  gae_lambda: 0.95
  ppo_epochs: 4
  vaoi_reward_scale: 0.1
  use_budget_advantage: false
  update_multiplier: false
  initial_multiplier: 0.0
  multiplier_learning_rate: 0.01
  multiplier_max: 0.15
  tx_ratio_ema_beta: 0.5
  budget_relative_tolerance: 0.05
  multiplier_error_clip: 1.0
  # 信道分布已变化，从零初始化 residual 可保持对照结论干净。
  initial_checkpoint: null
validation:
  enabled: true
  trigger: every_episodes
  every_episodes: 10
  checkpoint_mode: validation_best_only
  scenarios:
    - {id: v00, topology_seed: 51000, source_update_seed: 61000, channel_shadowing_seed: 71000, channel_fading_seed: 81000, policy_action_seed: 91000, slots: 500, n_nodes: 100, update_probability: 0.20, target_tx_ratio: 0.15}
    - {id: v01, topology_seed: 51001, source_update_seed: 61001, channel_shadowing_seed: 71001, channel_fading_seed: 81001, policy_action_seed: 91001, slots: 500, n_nodes: 100, update_probability: 0.20, target_tx_ratio: 0.15}
    - {id: v02, topology_seed: 51002, source_update_seed: 61002, channel_shadowing_seed: 71002, channel_fading_seed: 81002, policy_action_seed: 91002, slots: 500, n_nodes: 100, update_probability: 0.20, target_tx_ratio: 0.15}
    - {id: v03, topology_seed: 51003, source_update_seed: 61003, channel_shadowing_seed: 71003, channel_fading_seed: 81003, policy_action_seed: 91003, slots: 500, n_nodes: 100, update_probability: 0.20, target_tx_ratio: 0.15}
    - {id: v04, topology_seed: 51004, source_update_seed: 61004, channel_shadowing_seed: 71004, channel_fading_seed: 81004, policy_action_seed: 91004, slots: 500, n_nodes: 100, update_probability: 0.20, target_tx_ratio: 0.15}
    - {id: v05, topology_seed: 51005, source_update_seed: 61005, channel_shadowing_seed: 71005, channel_fading_seed: 81005, policy_action_seed: 91005, slots: 500, n_nodes: 100, update_probability: 0.20, target_tx_ratio: 0.15}
    - {id: v06, topology_seed: 51006, source_update_seed: 61006, channel_shadowing_seed: 71006, channel_fading_seed: 81006, policy_action_seed: 91006, slots: 500, n_nodes: 100, update_probability: 0.20, target_tx_ratio: 0.15}
    - {id: v07, topology_seed: 51007, source_update_seed: 61007, channel_shadowing_seed: 71007, channel_fading_seed: 81007, policy_action_seed: 91007, slots: 500, n_nodes: 100, update_probability: 0.20, target_tx_ratio: 0.15}
    - {id: v08, topology_seed: 51008, source_update_seed: 61008, channel_shadowing_seed: 71008, channel_fading_seed: 81008, policy_action_seed: 91008, slots: 500, n_nodes: 100, update_probability: 0.20, target_tx_ratio: 0.15}
    - {id: v09, topology_seed: 51009, source_update_seed: 61009, channel_shadowing_seed: 71009, channel_fading_seed: 81009, policy_action_seed: 91009, slots: 500, n_nodes: 100, update_probability: 0.20, target_tx_ratio: 0.15}
output:
  root: result_2layers
  save_per_slot: false
  make_plots: false
