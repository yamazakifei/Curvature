# Stage-2 MPNN + reused V3.2 Stage-1 search with a one-sided mean-probability Bmax loss.
# Stage-1 search is disabled because the selected community-topology V3.2 result is written below.
# Expected command:
# python scripts/train_nn_ctde.py --config configs/GNN/mpnnV3.3_ch1_Bpen_search.yaml

experiment:
  id: mpnnV3.3_Bpen_ch2_n100_u0.20_b0.30_curvBmax20
  description: "V3.3 single-N comparison: MPNN curvature edge-feature bmax=20; Stage-1 values reused from the Bmax=1 reference run."
  master_seed: 20260723
  slots: &full_evaluation_slots 500

# 仅修改 master_seed 即可联动更换 calibration/search/training/validation 四个集合。
randomness:
  mode: derived_namespaces
  save_manifest: true
  derivation_version: v1

topology:
  type: soft_two_community
  params:
    n_nodes: &n_nodes 100
    cluster_sizes: [50, 50]
    area_width_m: 400.0
    area_height_m: 300.0
    communication_radius_m: 40.0
    center_separation_m: 160.0
    cluster_radius_m: 80.0
    cross_edge_count_range: [2, 4]
    min_cross_endpoints_per_cluster: 2
    min_degree: 3
    require_induced_cluster_connected: true
    min_edge_connectivity: 2
    max_attempts: 2000

source:
  update_probability: &update_probability 0.20

channel:
  tx_power_dbm: 20.0
  pathloss_reference_db: 30.0
  reference_distance_m: 1.0
  pathloss_exponent: 2.5
  shadowing_std_db: 0.0
  reciprocal_shadowing: true
  rayleigh_fading: true
  noise_psd_dbm_per_hz: -174.0
  bandwidth_hz: 1000000.0
  noise_figure_db: 5.0
  sinr_threshold_db: 0

curvature:
  method: distributed_af3
  normalization: local_degree_bound

constraints:
  # Bmax仅表示长期全网平均广播概率上限。
  max_tx_ratio: &max_tx_ratio 0.30
  per_node_cap_multiplier: 1.5

actor:
  stage: 2
  curvature:
    enabled: true
    score: incident_bottleneck_max

    # V3.2新搜索显式删除c_kappa：q_base = sigmoid(beta0 + alpha * score)。
    # center仍保留数值0.0，供旧Actor图构建接口使用。
    center_mode: none
    center: 0.0
    alpha_parameterization: softplus

    # 搜索关闭时的直接配置，也是兼容回退值。
    alpha_init: 1.5
    # Reused from the soft_two_community V3.2 Stage-1 result; no random-geometric parameters.
    # Match the persisted Stage-1 values in the Bmax=1 reference result.
    alpha_override: 1.2
    base_tx_ratio: 0.09375
    calibrated_intercept: -2.77447509765625

    base_search:
      schema_version: v3_2
      enabled: false

      # 只生成拓扑、计算AF3和score，并为每个(b, alpha)校准beta0。
      calibration:
        topology_count: 32
        intercept_tolerance: 1.0e-6
        intercept_max_iterations: 100

      # b由Bmax自动粗搜，并对每个alpha独立局部细化。
      base_candidates:
        mode: coarse_to_fine
        min_fraction_of_max: 0.25
        max_fraction_of_max: 1.0
        coarse_count: 7
        refine: true
        refine_count: 5
        refine_per_alpha: true

      # alpha仍由用户显式给定，不自动生成。
      alpha_candidates: [0.5, 1.0, 1.2, 1.5, 1.8]

      evaluation:
        topology_count: 20
        dynamic_repeats: 2
        coarse_topology_count: 10
        coarse_dynamic_repeats: 1

        # V3.2：粗搜短仿真，full阶段保留原500 slots。
        coarse_slots: 200
        full_slots: *full_evaluation_slots
        # 旧代码/旧字段兼容回退；V3.2实现应优先读取coarse_slots/full_slots。
        slots: *full_evaluation_slots

        metric: mean_VAoI
        max_probability_tolerance: 0.005
        tie_relative_tolerance: 0.01
        prefer_lower_probability_on_tie: true

        # 每个alpha仅保留coarse top-2进入full，其余只保留粗搜记录。
        candidate_selection:
          coarse_keep_top_k_per_alpha: 2

        # 串行时全局复用；进程并行时每个worker只构建一次本地cache。
        cache:
          enabled: true
          cache_topology: true
          cache_curvature: true
          cache_propagation: true

        # 候选级进程并行。workers=0表示自动选择。
        parallel:
          enabled: true
          backend: process
          workers: 4
          chunksize: 1
          deterministic_order: true

        runtime_profile:
          enabled: true
          output_file: stage1_search_runtime.json

      save_per_scenario: true

  residual:
    enabled: true
    architecture: mpnn
    hidden_dims: [64, 64]
    activation: relu
    delta_max: 1.0
    zero_init_output: true
    use_stage1_reference: true
    detach_stage1_reference: true
    include_scenario_context: false   # Actor MPNN 是否使用场景级特征 N&u&Bmax
    include_curvature_mean: false
    include_curvature_freshness_interaction: false
    # 搜索结束后冻结选中的b、alpha和beta0；center固定为0。
    freeze_stage1: true
    mpnn:
      message_hidden_dims: [32]
      message_dim: 16
      update_hidden_dims: [64, 64]
      aggregation: mean_max
      condition_message_on_receiver: true
      use_sender_node_features: false
      use_curvature_edge_feature: true
      # Normalize the raw negative-AF3 edge bottleneck score over [0, 20].
      bmax: 20.0
      # Keep the V3.3 Stage-2 edge encoding as raw curvature divided by bmax.
      edge_normalization: raw_bmax

critic:
  architecture: node_conditioned
  hidden_dims: [64, 64]
  activation: relu
  include_scenario_context: true      # Critic 是否使用场景级特征 N&u&Bmax
  include_exact_node_features: true
  include_channel_features: true
  include_curvature_features: true
  advantage_mode: node_gae
  bootstrap_rollout_end: true

observation:
  consecutive_tx_scale: 3.0
  neighbor_confidence_time_constant: 20.0
  congestion_ewma_beta: 0.8
  congestion_feature_scale: 5.0

training:
  episodes: 500
  rollout_slots: 400

  max_tx_ratios: [*max_tx_ratio]
  node_counts: [*n_nodes]
  update_probabilities: [*update_probability]

  actor_learning_rate: 0.0001
  critic_learning_rate: 0.0003
  common_mode_coefficient: 0.05
  # Penalize only the per-rollout whole-network mean probability above Bmax.
  probability_budget_coefficient: 0.8   # set actor loss penalty for broadcast probability above Bmax
  clip_ratio: 0.2
  entropy_coefficient: 0.0
  gamma: 0.99
  gae_lambda: 0.95
  ppo_epochs: 4
  vaoi_reward_scale: 0.1

  # Detailed Stage-2/MPNN diagnostics are optional because they add extra
  # TensorFlow inference calls during the rollout.
  diagnostics:
    enabled: false
    every_episodes: 20
    include_mpnn_messages: false

  use_budget_advantage: true
  update_multiplier: true
  initial_multiplier: 0.0
  multiplier_learning_rate: 0.01
  multiplier_max: 0.15
  tx_ratio_ema_beta: 0.5
  budget_relative_tolerance: 0.0
  multiplier_error_clip: 1.0

  initial_checkpoint: null
  restore_actor_only: true

validation:
  enabled: true
  trigger: every_episodes
  every_episodes: 10
  checkpoint_mode: validation_best_only
  # Training-time validation selects checkpoints from NN VAoI and its mean
  # broadcast probability; baselines are restored for final evaluation.
  evaluate_baselines: false   # 验证时是否测试其他baseline

  scenario_generation:
    mode: auto
    scenario_count: 20
    slots: *full_evaluation_slots
    n_nodes: *n_nodes
    update_probability: *update_probability
    max_tx_ratio: *max_tx_ratio

output:
  root: result_GNN
  save_per_slot: false
  make_plots: false
