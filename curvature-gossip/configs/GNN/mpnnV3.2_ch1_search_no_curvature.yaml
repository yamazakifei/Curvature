# Function: train the V3.2 Stage-2 MPNN with a searched uniform Stage-1
# probability, while excluding curvature from both Actor and Critic inputs.
# The topology, search pool, PPO settings, and validation horizon are paired
# with 【mpnnV3.2_search_ch1_n100_u0.20_Bmax0.10_stage1_no_center】.

experiment:
  id: mpnnV3.2_search_ch1_no_curvature_n100_u0.20_Bmax0.10_stage1_uniform
  description: "V3.2 strict no-curvature ablation: SearchBase searches a uniform Stage-1 probability with alpha=0.0."
  master_seed: 20260723
  slots: 500

randomness:
  mode: derived_namespaces
  save_manifest: true
  derivation_version: v1

topology:
  type: soft_two_community
  params:
    n_nodes: 100
    cluster_sizes: [50, 50]
    area_width_m: 400.0
    area_height_m: 300.0
    communication_radius_m: 40.0
    center_separation_m: 160.0
    cluster_radius_m: 80.0
    cross_edge_count_range: [2, 4]
    min_cross_endpoints_per_cluster: 2
    min_degree: 3
    require_induced_cluster_connected: true
    min_edge_connectivity: 2
    max_attempts: 2000

source:
  update_probability: 0.20

channel:
  tx_power_dbm: 20.0
  pathloss_reference_db: 30.0
  reference_distance_m: 1.0
  pathloss_exponent: 2.5
  shadowing_std_db: 0.0
  reciprocal_shadowing: true
  rayleigh_fading: false
  noise_psd_dbm_per_hz: -174.0
  bandwidth_hz: 1000000.0
  noise_figure_db: 5.0
  sinr_threshold_db: -3.0

curvature:
  # The simulator may still calculate physical curvature for a paired
  # environment, but the no-curvature Actor/Critic paths do not consume it.
  method: distributed_af3
  normalization: local_degree_bound

constraints:
  max_tx_ratio: 0.10
  per_node_cap_multiplier: 1.5

actor:
  stage: 2
  curvature:
    # alpha=0 makes q_i^base identical for every node; enabled=false prevents
    # curvature from entering the Stage-2 Actor feature path.
    enabled: false
    score: incident_bottleneck_max
    center_mode: none
    center: 0.0
    alpha_parameterization: softplus
    base_tx_ratio: 0.10
    alpha_init: 1.5
    alpha_override: 0.0

    # Search the uniform base probability b using the same V3.2 SearchBase
    # protocol and paired topology/channel evaluation settings.
    base_search:
      schema_version: v3_2
      enabled: true
      calibration:
        topology_count: 32
        intercept_tolerance: 1.0e-6
        intercept_max_iterations: 100
      base_candidates:
        mode: coarse_to_fine
        min_fraction_of_max: 0.25
        max_fraction_of_max: 1.0
        coarse_count: 7
        refine: true
        refine_count: 5
        refine_per_alpha: true
      alpha_candidates: [0.0]
      evaluation:
        topology_count: 20
        dynamic_repeats: 2
        coarse_topology_count: 10
        coarse_dynamic_repeats: 1
        coarse_slots: 200
        full_slots: 500
        slots: 500
        metric: mean_VAoI
        max_probability_tolerance: 0.005
        tie_relative_tolerance: 0.01
        prefer_lower_probability_on_tie: true
        candidate_selection:
          coarse_keep_top_k_per_alpha: 2
        cache:
          enabled: true
          cache_topology: true
          cache_curvature: true
          cache_propagation: true
        parallel:
          enabled: true
          backend: process
          workers: 4
          chunksize: 1
          deterministic_order: true
        runtime_profile:
          enabled: true
          output_file: stage1_search_runtime.json
      save_per_scenario: true

  residual:
    enabled: true
    architecture: mpnn
    hidden_dims: [64, 64]
    activation: relu
    delta_max: 1.0
    zero_init_output: true
    # The uniform Stage-1 probability is not passed as a curvature reference.
    use_stage1_reference: false
    detach_stage1_reference: true
    include_scenario_context: false
    include_curvature_mean: false
    include_curvature_freshness_interaction: false
    freeze_stage1: true
    mpnn:
      message_hidden_dims: [32]
      message_dim: 16
      update_hidden_dims: [64, 64]
      aggregation: mean_max
      condition_message_on_receiver: true
      use_sender_node_features: false
      use_curvature_edge_feature: false
      bmax: 1.0

critic:
  architecture: node_conditioned
  hidden_dims: [64, 64]
  activation: relu
  include_scenario_context: true
  include_exact_node_features: true
  include_channel_features: true
  include_curvature_features: false
  advantage_mode: node_gae
  bootstrap_rollout_end: true

observation:
  consecutive_tx_scale: 3.0
  neighbor_confidence_time_constant: 20.0
  congestion_ewma_beta: 0.8
  congestion_feature_scale: 5.0

training:
  episodes: 300
  rollout_slots: 400
  max_tx_ratios: [0.10]
  node_counts: [100]
  update_probabilities: [0.20]
  actor_learning_rate: 0.0001
  critic_learning_rate: 0.0003
  common_mode_coefficient: 0.05
  clip_ratio: 0.2
  entropy_coefficient: 0.0
  gamma: 0.99
  gae_lambda: 0.95
  ppo_epochs: 4
  vaoi_reward_scale: 0.1
  use_budget_advantage: true
  update_multiplier: true
  initial_multiplier: 0.0
  multiplier_learning_rate: 0.01
  multiplier_max: 0.15
  tx_ratio_ema_beta: 0.5
  budget_relative_tolerance: 0.05
  multiplier_error_clip: 1.0
  initial_checkpoint: null
  restore_actor_only: true

validation:
  enabled: true
  trigger: every_episodes
  every_episodes: 10
  checkpoint_mode: validation_best_only
  scenario_generation:
    mode: auto
    scenario_count: 10
    slots: 500
    n_nodes: 100
    update_probability: 0.20
    max_tx_ratio: 0.10

output:
  root: result_GNN
  save_per_slot: false
  make_plots: false
