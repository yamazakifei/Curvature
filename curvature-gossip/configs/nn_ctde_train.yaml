# 正式 CTDE 训练默认配置；可在保持 result_NN 隔离的前提下扩展训练分布。
experiment:
  id: nn_ctde_af3_n100
  master_seed: 20260716
  slots: 500
topology:
  type: soft_two_community
  params:
    n_nodes: 100
    cluster_sizes: [50, 50]
    area_width_m: 400.0
    area_height_m: 300.0
    communication_radius_m: 40.0
    center_separation_m: 160.0
    cluster_radius_m: 80.0
    cross_edge_count_range: [2, 4]
    min_cross_endpoints_per_cluster: 2
    min_degree: 3
    require_induced_cluster_connected: true
    min_edge_connectivity: 2
    max_attempts: 2000
source:
  update_probability: 0.05
channel:
  tx_power_dbm: 20.0
  pathloss_reference_db: 30.0
  reference_distance_m: 1.0
  pathloss_exponent: 2.7
  shadowing_std_db: 4.0
  reciprocal_shadowing: true
  rayleigh_fading: true
  noise_psd_dbm_per_hz: -174.0
  bandwidth_hz: 5000000.0
  noise_figure_db: 7.0
  sinr_threshold_db: 3.0
curvature:
  method: distributed_af3
  normalization: local_degree_bound
constraints:
  target_tx_ratio: 0.075
  per_node_cap_multiplier: 1.5
training:
  # 4 个预算 × 3 个规模 × 4 个更新率，各组合至少训练一个 episode。
  episodes: 48
  rollout_slots: 500
  topology_seed_start: 40000
  target_tx_ratios: [0.05, 0.075, 0.10, 0.125]
  node_counts: [80, 100, 120]
  update_probabilities: [0.05, 0.10, 0.20, 0.40]
  learning_rate: 0.0003
  clip_ratio: 0.2
  entropy_coefficient: 0.01
  gamma: 0.99
  gae_lambda: 0.95
  lagrange_learning_rate: 0.5
  local_debt_penalty: 0.02
  ppo_epochs: 4
  q_min: 0.001
  q_max: 0.5
output:
  root: result_NN
  save_per_slot: false
  make_plots: false
