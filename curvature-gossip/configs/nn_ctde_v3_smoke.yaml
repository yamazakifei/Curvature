# V3 CTDE-PPO smoke configuration: validates rollout, PPO, checkpoint, and reload paths.
experiment:
  id: nn_ctde_v3_smoke
  master_seed: 20260723
  slots: 40
topology:
  type: random_geometric
  params:
    n_nodes: 16
    area_width_m: 120.0
    area_height_m: 120.0
    communication_radius_m: 65.0
    min_degree: 2
    max_attempts: 1000
source:
  update_probability: 0.05
channel:
  tx_power_dbm: 20.0
  pathloss_reference_db: 30.0
  pathloss_exponent: 2.5
  shadowing_std_db: 2.0
  rayleigh_fading: true
  sinr_threshold_db: 3.0
curvature:
  method: distributed_af3
  normalization: local_degree_bound
constraints:
  target_tx_ratio: 0.10
  per_node_cap_multiplier: 1.5
training:
  episodes: 2
  rollout_slots: 40
  topology_seed_start: 30000
  target_tx_ratios: [0.10]
  node_counts: [16]
  update_probabilities: [0.05]
  learning_rate: 0.0003
  clip_ratio: 0.2
  entropy_coefficient: 0.01
  gamma: 0.99
  gae_lambda: 0.95
  ppo_epochs: 2
  vaoi_reward_scale: 0.1
  consecutive_tx_scale: 3.0
  neighbor_confidence_time_constant: 20.0
  initial_multiplier: 0.0
  multiplier_learning_rate: 0.01
  multiplier_max: 0.15
  tx_ratio_ema_beta: 0.9
  budget_relative_tolerance: 0.05
  multiplier_error_clip: 1.0
output:
  root: result_NN
  save_per_slot: false
  make_plots: false
