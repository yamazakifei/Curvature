  trace_stride: 10
  topology_seeds:
  - 1
  channel_seeds:
  - 0
  update_seeds:
  - 0
topology:
  type: soft_two_community
  params:
    n_nodes: 100
    cluster_sizes:
    - 50
    - 50
    area_width_m: 400.0
